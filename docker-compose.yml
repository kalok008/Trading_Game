services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: football_trading
      POSTGRES_USER: football_trading
      POSTGRES_PASSWORD: football_trading
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
